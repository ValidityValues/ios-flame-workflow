name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Patch and script checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate patch series and source syntax
        run: python3 tools/validate-repo.py --verbose
